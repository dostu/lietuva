/* Išdėstymas: žemėlapis – visas lapas iki kraštų; šalia (plačiame ekrane) arba po juo (telefone) – atlaso legendos stiliaus skydelis. */
:root {
  --paper: #EDF0E7; --panel: #F8F9F3; --ink: #1B2A28; --ink2: #56655F; --rule: #CBD2C4;
  --sea: #BDD5DB; --sea2: #86AEBB; --land: #E8EDD6; --land2: #E2E2D8; --river: #2E79A6; --frontier: #B5506B;
  --amber: #D5861A; --pine: #1E5B46; --on-pine: #F4F7EE;
  --good: #2F8F5B; --ok: #B0941C; --warn: #D07A24; --bad: #BF4A3F;
  --f-display: "Barlow Condensed", "Arial Narrow", "Roboto Condensed", sans-serif;
  --f-body: "Barlow", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-map: "Literata", Georgia, "Times New Roman", serif;
  --gut-l: max(16px, env(safe-area-inset-left, 0px)); --gut-r: max(16px, env(safe-area-inset-right, 0px));
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #111816; --panel: #18211E; --ink: #E7ECE3; --ink2: #9DABA3; --rule: #2E3A35;
  --sea: #0F1F27; --sea2: #2B5564; --land: #25342C; --land2: #1A2320; --river: #63AAD2; --frontier: #D4809A;
  --amber: #F0A63A; --pine: #74C6A4; --on-pine: #0F1A16;
  --good: #58BF86; --ok: #D8BD45; --warn: #EC9A4A; --bad: #E5746A; color-scheme: dark } }
:root[data-theme="dark"] {
  --paper: #111816; --panel: #18211E; --ink: #E7ECE3; --ink2: #9DABA3; --rule: #2E3A35;
  --sea: #0F1F27; --sea2: #2B5564; --land: #25342C; --land2: #1A2320; --river: #63AAD2; --frontier: #D4809A;
  --amber: #F0A63A; --pine: #74C6A4; --on-pine: #0F1A16;
  --good: #58BF86; --ok: #D8BD45; --warn: #EC9A4A; --bad: #E5746A; color-scheme: dark }

html, body { height: 100%; }
body { background: var(--paper); color: var(--ink); font: 400 15px/1.45 var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--amber); outline-offset: 2px; }

#app { height: 100%; display: grid; grid-template: "top" auto "map" minmax(0, 1fr) "panel" auto "credits" auto / minmax(0, 1fr); }
#app[data-screen="summary"] { grid-template-rows: auto minmax(0, 2fr) minmax(0, 3fr) auto; }
#top { grid-area: top; display: flex; align-items: center; gap: 12px; padding: 8px var(--gut-r) 8px var(--gut-l); background: var(--panel); border-bottom: 1px solid var(--rule); min-height: 48px; }
h1 { margin: 0; font: 700 1.55rem/1 var(--f-display); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; }
h1 i { font-style: normal; color: var(--amber); }
#hud { margin-left: auto; display: flex; align-items: center; gap: 14px; min-width: 0; }
.sqs { display: flex; gap: 3px; }
.sq { width: 12px; height: 12px; border-radius: 2px; background: var(--rule); flex: none; }
.sq[data-s="good"] { background: var(--good); } .sq[data-s="ok"] { background: var(--ok); }
.sq[data-s="warn"] { background: var(--warn); } .sq[data-s="bad"] { background: var(--bad); }
.sq[data-s="now"] { background: none; box-shadow: inset 0 0 0 2px var(--ink); }
.score { font: 700 1.35rem/1 var(--f-display); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score small { font: 600 .72rem/1 var(--f-display); letter-spacing: .08em; text-transform: uppercase; color: var(--ink2); margin-left: 5px; }
.quit { border: 0; background: none; padding: 6px 2px; font: 600 .8rem/1 var(--f-display); letter-spacing: .06em; text-transform: uppercase; color: var(--ink2); cursor: pointer; white-space: nowrap; }
.quit:hover { color: var(--ink); }

#mapwrap { grid-area: map; position: relative; min-height: 0; background: var(--sea); overflow: hidden; }
#map { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
#mapctl { position: absolute; bottom: 8px; right: var(--gut-r); display: grid; grid-auto-flow: column; gap: 6px; }
#mapctl button { width: 40px; height: 40px; border: 1px solid var(--rule); border-radius: 4px; background: var(--panel); font: 600 1.35rem/1 var(--f-display); cursor: pointer; display: grid; place-items: center; }
#mapctl button:hover { border-color: var(--ink2); }
#mapctl svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.8; }

#panel { grid-area: panel; padding: 14px var(--gut-r) 12px var(--gut-l); background: var(--panel); border-top: 1px solid var(--rule); display: flex; flex-direction: column; gap: 10px; min-height: 0; min-width: 0; }
#app[data-screen="summary"] #panel, #app[data-screen="setup"] #panel { overflow: auto; }
#credits { grid-area: credits; padding: 0 var(--gut-r) 8px var(--gut-l); background: var(--panel); font-size: .68rem; line-height: 1.35; color: var(--ink2); }
#credits a { color: inherit; }

.eyebrow { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 6px 12px; font: 600 .78rem/1.1 var(--f-display); letter-spacing: .09em; text-transform: uppercase; color: var(--ink2); }
.q { margin: 0; font: 600 clamp(1.6rem, 6.4vw, 2.15rem)/1.04 var(--f-display); text-wrap: balance; }
.q b { font-weight: 700; color: var(--pine); }
.hint { margin: 0; color: var(--ink2); font-size: .86rem; min-height: 1.3em; }
.lede { margin: 0; font-size: 1rem; max-width: 34ch; }
.fact { margin: 0; font: italic 400 .95rem/1.42 var(--f-map); max-width: 60ch; }
.fact b { font: 600 .95rem/1.42 var(--f-body); font-style: normal; }

.btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; min-height: 48px; padding: 8px 16px; border: 1.5px solid var(--ink); border-radius: 4px; background: transparent; font: 600 1.12rem/1.1 var(--f-display); letter-spacing: .05em; text-transform: uppercase; cursor: pointer; text-align: center; }
.btn small { font: 400 .78rem/1.2 var(--f-body); letter-spacing: 0; text-transform: none; opacity: .85; }
.btn.stack { flex-direction: column; gap: 3px; min-height: 58px; }
